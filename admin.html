<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#394155">
<meta name="robots" content="noindex, nofollow">
<title>Результаты сотрудников — GEMBALAB</title>
<link rel="icon" type="image/png" href="assets/img/emblem-white.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="Cabinet/cabinet.css">
<style>
  /* Небольшие стили только для этой служебной страницы */
  .admin-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .admin-logo {
    height: 32px;
    margin-bottom: 36px;
  }
  .admin-gate {
    max-width: 380px;
    margin: 60px auto;
    text-align: center;
  }
  .admin-gate h1 {
    font-family: "Oswald", "Roboto", sans-serif;
    font-size: 20px;
    color: var(--graphite);
    margin-bottom: 8px;
  }
  .admin-gate .cabinet__placeholder {
    margin-bottom: 22px;
  }
  .admin-gate .cabinet__input {
    width: 100%;
    margin-bottom: 16px;
    box-sizing: border-box;
  }
  .admin-gate .btn {
    width: 100%;
  }
  .admin-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 12px;
  }
  .admin-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .admin-toolbar h1 {
    font-family: "Oswald", "Roboto", sans-serif;
    font-size: 20px;
    color: var(--graphite);
  }
  .admin-toolbar-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .admin-table-wrap {
    overflow-x: auto;
    margin-top: 20px;
  }
  .admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 720px;
  }
  .admin-table th,
  .admin-table td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .admin-table th {
    font-family: "Oswald", "Roboto", sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-muted);
  }
  .admin-table td.admin-name {
    white-space: normal;
    font-weight: 600;
    color: var(--graphite);
  }
  .admin-tier--high {
    color: var(--red);
    font-weight: 600;
  }
  /* Стиль "btn--outline" сайта рассчитан на тёмный фон (белый текст на
     полупрозрачной белой рамке) — на этой странице фон светлый, поэтому
     переопределяем цвет для всех таких кнопок здесь, иначе они невидимы
     (белый текст на белом фоне). */
  .btn--outline {
    color: var(--graphite);
    border-color: var(--border);
  }
  .btn--outline:hover {
    border-color: var(--graphite);
    background: var(--bg-soft);
  }
  .admin-actions {
    display: flex;
    gap: 8px;
  }
  .admin-detail-btn,
  .admin-delete-btn {
    font-size: 12px;
    padding: 6px 12px;
  }
  .admin-delete-btn {
    color: var(--red);
    border-color: var(--red);
  }
  .admin-delete-btn:hover {
    background: rgba(233, 21, 43, 0.08);
  }
  .admin-detail-row td {
    padding: 0;
    border-bottom: 1px solid var(--border);
  }
  .admin-detail {
    display: none;
    padding: 24px 14px 30px;
    background: var(--bg-soft);
    white-space: normal;
  }
  .admin-detail--open {
    display: block;
  }
  .admin-detail .cabinet__result-chart,
  .admin-detail .cabinet__result-scores,
  .admin-detail .cabinet__result-breakdown,
  .admin-detail .cabinet__result-recommend {
    background: #fff;
  }
  .admin-answers {
    max-width: 720px;
    font-size: 13px;
    color: var(--graphite);
    line-height: 1.8;
    padding-left: 20px;
  }
  .admin-answers li {
    margin-bottom: 4px;
  }
  .admin-no-ai-note {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  /* Печать / "Сохранить как PDF" — скрываем всё лишнее (форма входа, кнопки,
     статус), карточки с подробностями показываем всегда, независимо от того,
     были ли они развёрнуты на экране. */
  @media print {
    .admin-gate,
    .admin-toolbar-actions,
    .admin-actions,
    #adminStatus {
      display: none !important;
    }
    .admin-detail {
      display: block !important;
      background: #fff;
    }
    .admin-detail-row {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .admin-table {
      min-width: 0;
    }
    .admin-table th,
    .admin-table td {
      white-space: normal;
    }
  }
</style>
</head>
<body>
<div class="admin-wrap">
  <img class="admin-logo" src="assets/img/logo-color.png" alt="GEMBALAB">

  <div class="admin-gate" id="adminGate">
    <h1>Результаты сотрудников</h1>
    <p class="cabinet__placeholder">Служебная страница — введите пароль администратора.</p>
    <form id="adminLoginForm">
      <input type="password" class="cabinet__input" id="adminPassword" placeholder="Пароль" autocomplete="current-password">
      <button type="submit" class="btn btn--primary">Войти</button>
      <p class="admin-error" id="adminLoginError" style="display:none;"></p>
    </form>
  </div>

  <div id="adminContent" style="display:none;">
    <div class="admin-toolbar">
      <h1>Результаты сотрудников — Тест Маслоу</h1>
      <div class="admin-toolbar-actions">
        <button type="button" class="btn btn--outline" id="adminRefreshBtn">Обновить</button>
        <button type="button" class="btn btn--outline" id="adminPdfBtn">Скачать PDF</button>
      </div>
    </div>
    <p class="cabinet__placeholder" id="adminStatus"></p>

    <div class="admin-table-wrap">
      <table class="admin-table" id="adminTable">
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Отдел / должность</th>
            <th>Дата прохождения</th>
            <th>Безопасность</th>
            <th>Принадлежность</th>
            <th>Уважение</th>
            <th>Самореализация</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Используем те же функции подсчёта "уровня" (высокая/средняя/низкая),
     что и на самом сайте — чтобы цифры совпадали. -->
<script src="Cabinet/quiz-maslow.js"></script>
<script>
(function () {
  // Тот же адрес сервера, что и у самого теста.
  var ADMIN_WORKER_URL = "https://gembalab-maslow-report.gembalab.workers.dev";

  var gateEl = document.getElementById("adminGate");
  var contentEl = document.getElementById("adminContent");
  var loginForm = document.getElementById("adminLoginForm");
  var passwordInput = document.getElementById("adminPassword");
  var loginErrorEl = document.getElementById("adminLoginError");
  var statusEl = document.getElementById("adminStatus");
  var tableBodyEl = document.getElementById("adminTableBody");
  var refreshBtn = document.getElementById("adminRefreshBtn");
  var pdfBtn = document.getElementById("adminPdfBtn");

  var currentPassword = null; // хранится только в памяти вкладки, никуда не сохраняется
  var currentRows = [];

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
  }

  function scoreCell(score) {
    var tier = maslowTier(score);
    var cls = tier === "high" ? ' class="admin-tier--high"' : "";
    return "<td" + cls + ">" + score + " (" + maslowTierLabel(tier) + ")</td>";
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function safeParse(json) {
    if (!json) return null;
    try {
      return JSON.parse(json);
    } catch (e) {
      return null;
    }
  }

  function buildAnswersList(answers) {
    var wrap = document.createElement("div");
    if (!answers || !Array.isArray(answers) || answers.length !== MASLOW_QUESTIONS.length) {
      wrap.innerHTML = '<p class="cabinet__placeholder">Ответы по вопросам не сохранены для этой записи (тест был пройден до появления этой функции).</p>';
      return wrap;
    }
    var ol = document.createElement("ol");
    ol.className = "admin-answers";
    MASLOW_QUESTIONS.forEach(function (q, i) {
      var chosen = answers[i];
      var label = chosen != null && MASLOW_OPTIONS[chosen] != null ? MASLOW_OPTIONS[chosen] : "—";
      var li = document.createElement("li");
      li.textContent = q.text + " — " + label;
      ol.appendChild(li);
    });
    wrap.appendChild(ol);
    return wrap;
  }

  // Разворачиваемая карточка сотрудника — использует ту же функцию
  // renderMaslowReport(), что и сам тест на сайте, поэтому вид совпадает
  // один в один (график, расшифровка, рекомендации), плюс список ответов
  // по каждому вопросу.
  function buildDetail(r) {
    var wrap = document.createElement("div");
    wrap.className = "admin-detail";

    var aiBreakdown = safeParse(r.ai_breakdown);
    var aiData = aiBreakdown ? { breakdown: aiBreakdown, recommendations_intro: r.ai_recommendations || "" } : null;

    if (!aiData) {
      var note = document.createElement("p");
      note.className = "admin-no-ai-note";
      note.textContent = "Сотрудник не формировал ИИ-отчёт — ниже стандартный (шаблонный) разбор по баллам.";
      wrap.appendChild(note);
    }

    var chartEl = document.createElement("div");
    chartEl.className = "cabinet__result-chart";
    var scoresTitle = document.createElement("h4");
    scoresTitle.className = "cabinet__section-title";
    scoresTitle.textContent = "Расшифровка результатов";
    var scoresEl = document.createElement("ul");
    scoresEl.className = "cabinet__result-scores";
    var breakdownEl = document.createElement("div");
    breakdownEl.className = "cabinet__result-breakdown";
    var recommendTitle = document.createElement("h4");
    recommendTitle.className = "cabinet__section-title";
    recommendTitle.textContent = "Рекомендации";
    var recommendEl = document.createElement("div");
    recommendEl.className = "cabinet__result-recommend";
    var appendixEl = document.createElement("div"); // не показываем, но нужен для renderMaslowReport

    wrap.appendChild(chartEl);
    wrap.appendChild(scoresTitle);
    wrap.appendChild(scoresEl);
    wrap.appendChild(breakdownEl);
    wrap.appendChild(recommendTitle);
    wrap.appendChild(recommendEl);

    renderMaslowReport(
      { chartEl: chartEl, scoresEl: scoresEl, breakdownEl: breakdownEl, recommendEl: recommendEl, appendixEl: appendixEl },
      { safety: r.safety, belonging: r.belonging, esteem: r.esteem, selfact: r.selfact },
      aiData
    );

    var answersTitle = document.createElement("h4");
    answersTitle.className = "cabinet__section-title";
    answersTitle.textContent = "Ответы по вопросам";
    wrap.appendChild(answersTitle);
    wrap.appendChild(buildAnswersList(safeParse(r.answers)));

    return wrap;
  }

  function renderRows(rows) {
    currentRows = rows;
    tableBodyEl.innerHTML = "";
    if (!rows.length) {
      statusEl.textContent = "Пока никто не прошёл тест.";
      return;
    }
    statusEl.textContent = "Всего результатов: " + rows.length;
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="admin-name">' + escapeHtml(r.full_name) + "</td>" +
        "<td>" + escapeHtml(r.department || "—") + "</td>" +
        "<td>" + formatDate(r.submitted_at) + "</td>" +
        scoreCell(r.safety) +
        scoreCell(r.belonging) +
        scoreCell(r.esteem) +
        scoreCell(r.selfact) +
        '<td class="admin-actions">' +
        '<button type="button" class="btn btn--outline admin-detail-btn">Подробнее</button>' +
        '<button type="button" class="btn btn--outline admin-delete-btn">Удалить</button>' +
        "</td>";
      tableBodyEl.appendChild(tr);

      var detailRow = document.createElement("tr");
      detailRow.className = "admin-detail-row";
      var detailCell = document.createElement("td");
      detailCell.colSpan = 8;
      detailRow.appendChild(detailCell);
      tableBodyEl.appendChild(detailRow);

      var built = false;
      var detailEl = null;
      var btn = tr.querySelector(".admin-detail-btn");
      btn.addEventListener("click", function () {
        if (!built) {
          detailEl = buildDetail(r);
          detailCell.appendChild(detailEl);
          built = true;
        }
        var isOpen = detailEl.classList.toggle("admin-detail--open");
        btn.textContent = isOpen ? "Скрыть" : "Подробнее";
      });

      var deleteBtn = tr.querySelector(".admin-delete-btn");
      deleteBtn.addEventListener("click", function () {
        deleteRow(r.id, tr, detailRow, deleteBtn);
      });
    });
  }

  async function deleteRow(id, tr, detailRow, deleteBtn) {
    if (!window.confirm("Удалить результат «" + tr.querySelector(".admin-name").textContent + "» без возможности восстановления?")) {
      return;
    }
    deleteBtn.disabled = true;
    deleteBtn.textContent = "Удаляем…";
    try {
      var resp = await fetch(ADMIN_WORKER_URL + "/admin/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: currentPassword, id: id }),
      });
      var data = await resp.json().catch(function () { return null; });
      if (!resp.ok || !data || !data.ok) {
        throw new Error((data && data.error) || "HTTP " + resp.status);
      }
      tr.remove();
      detailRow.remove();
      currentRows = currentRows.filter(function (r) { return r.id !== id; });
      statusEl.textContent = "Всего результатов: " + currentRows.length;
    } catch (err) {
      deleteBtn.disabled = false;
      deleteBtn.textContent = "Удалить";
      window.alert("Не удалось удалить: " + (err && err.message ? err.message : "неизвестная ошибка"));
    }
  }

  async function loadResults(password) {
    statusEl.textContent = "Загружаем…";
    tableBodyEl.innerHTML = "";
    try {
      var resp = await fetch(ADMIN_WORKER_URL + "/admin/list", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password }),
      });
      var data = await resp.json().catch(function () { return null; });

      if (resp.status === 401) {
        throw { userMessage: "Неверный пароль." };
      }
      if (!resp.ok || !data || !data.ok) {
        throw { userMessage: (data && data.error) || "Не удалось загрузить результаты." };
      }

      currentPassword = password;
      gateEl.style.display = "none";
      contentEl.style.display = "";
      renderRows(data.rows || []);
    } catch (err) {
      if (contentEl.style.display === "none" || contentEl.style.display === "") {
        // Ещё не залогинены — показываем ошибку на форме входа.
      }
      var message = (err && err.userMessage) || "Не удалось загрузить результаты. Проверьте связь с сервером.";
      if (currentPassword === null) {
        loginErrorEl.textContent = message;
        loginErrorEl.style.display = "";
      } else {
        statusEl.textContent = message;
      }
    }
  }

  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    loginErrorEl.style.display = "none";
    var pwd = passwordInput.value;
    if (!pwd) return;
    loadResults(pwd);
  });

  refreshBtn.addEventListener("click", function () {
    if (currentPassword) loadResults(currentPassword);
  });

  pdfBtn.addEventListener("click", function () {
    if (!currentRows.length) return;
    // Раскрываем все карточки "Подробнее", чтобы в PDF попали полные данные
    // по каждому сотруднику, а не только сводная таблица.
    var toOpen = tableBodyEl.querySelectorAll(".admin-detail-btn");
    toOpen.forEach(function (btn) {
      if (btn.textContent === "Подробнее") btn.click();
    });
    window.setTimeout(function () {
      window.print();
    }, 50);
  });
})();
</script>
</body>
</html>
